<!DOCTYPE html>
<html>
  <head>
    <title>Pedestrian Experiment</title>
    <script src="https://unpkg.com/jspsych@8.2.3/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-video-keyboard-response@2.1.0/dist/index.browser.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/jspsych@8.2.3/css/jspsych.css">
    <style>
      body { background-color: white; color: black; }
      .jspsych-display-element { background-color: white; color: black; }
    </style>
  </head>
  <body></body>
  <script>

    const IMAGES_PER_CONDITION = 20; // Phase 1: 2×20=40張, Phase 2: 4×20=80張, 合計120張
    const PHASE1_REPS = 12;
    const PHASE2_REPS = 12;

    // ─── 產生某個 phase + condition 的圖片路徑清單 ──────────────
    function makeImages(phase, condition) {
      return Array.from({ length: IMAGES_PER_CONDITION }, (_, i) =>
        `images/p${phase}_${condition}_${String(i + 1).padStart(2, '0')}.jpg`
      );
    }

    const jsPsych = initJsPsych({
      on_finish: function() {
        const all_data = jsPsych.data.get().filterCustom(function(trial) {
          return trial.condition !== undefined;
        }).values();

        const headers = ['condition', 'phase', 'image', 'rt', 'response', 'trial_index', 'time_elapsed'];
        const rows = all_data.map(trial =>
          headers.map(h => '"' + String(trial[h] || '').replace(/"/g, '""') + '"').join(',')
        );
        const csv_data = headers.map(h => '"' + h + '"').join(',') + '\n' + rows.join('\n');

        window.parent.postMessage({
          type: "EXPERIMENT_DATA",
          csv_data: csv_data
        }, "*");
      }
    });

    // ─── FIXATION ───────────────────────────────────────────────
    const fixation = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: '<p style="font-size:48px;">+</p>',
      choices: "NO_KEYS",
      trial_duration: 300
    };

    // ─── ITI ────────────────────────────────────────────────────
    const iti = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: '',
      choices: "NO_KEYS",
      trial_duration: 500
    };

    // ─── HELPER: 產生一個 trial ──────────────────────────────────
    function make_trial(condition, phase, img_src) {
      return {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `
          <div style="text-align:center;">
            <img src="${img_src}" style="width:640px; height:360px; object-fit:cover; display:block; margin:0 auto 20px auto;">
            <p style="font-size:16px;">
              Press <strong>F</strong> = Brake &nbsp; &nbsp; &nbsp;
              Press <strong>J</strong> = Proceed
            </p>
          </div>
        `,
        choices: ['f', 'j'],
        data: {
          condition: condition,
          phase: phase,
          image: img_src
        }
      };
    }

    // ─── PHASE 1 CONDITIONS ──────────────────────────────────────
    // 只有 congruent conditions（訊號一致，無衝突）
    const phase1_conditions = ['congruent_proceed', 'congruent_brake'];

    const phase1_blocks = [];
    phase1_conditions.forEach(condition => {
      const shuffled = jsPsych.randomization.shuffle(makeImages(1, condition));
      for (let i = 0; i < PHASE1_REPS; i++) {
        phase1_blocks.push([
          fixation,
          make_trial(condition, 1, shuffled[i]),
          iti
        ]);
      }
    });
    const phase1_randomized = jsPsych.randomization.shuffle(phase1_blocks).flat();

    // ─── PHASE 2 CONDITIONS ──────────────────────────────────────
    const phase2_conditions = ['congruent_proceed', 'congruent_brake', 'conflict_A', 'conflict_B'];

    const phase2_blocks = [];
    phase2_conditions.forEach(condition => {
      const shuffled = jsPsych.randomization.shuffle(makeImages(2, condition));
      for (let i = 0; i < PHASE2_REPS; i++) {
        phase2_blocks.push([
          fixation,
          make_trial(condition, 2, shuffled[i]),
          iti
        ]);
      }
    });
    const phase2_randomized = jsPsych.randomization.shuffle(phase2_blocks).flat();

    // ─── INSTRUCTIONS ────────────────────────────────────────────
    const instructions_p1 = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <div style="max-width:600px; margin:0 auto; text-align:left;">
          <h2>Phase 1: Scene Classification</h2>
          <p>You will see a series of driving scenes.</p>
          <p>For each scene, respond <strong>as quickly as possible</strong>:</p>
          <ul>
            <li>Press <strong>F</strong> if you would <strong>Brake</strong></li>
            <li>Press <strong>J</strong> if you would <strong>Proceed</strong></li>
          </ul>
          <p>There are no right or wrong answers. <strong>Speed is most important.</strong></p>
          <br>
          <p style="text-align:center;">Press any key to begin.</p>
        </div>
      `,
      choices: "ALL_KEYS"
    };

    const instructions_p2 = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <div style="max-width:600px; margin:0 auto; text-align:left;">
          <h2>Phase 2: Judgment Task</h2>
          <p>You will see a series of driving scenes again.</p>
          <p>For each scene, judge whether you would:</p>
          <ul>
            <li>Press <strong>F</strong> = <strong>Brake</strong> for the pedestrian</li>
            <li>Press <strong>J</strong> = <strong>Proceed</strong> through</li>
          </ul>
          <p>Both <strong>speed and accuracy</strong> are important.</p>
          <br>
          <p style="text-align:center;">Press any key to begin.</p>
        </div>
      `,
      choices: "ALL_KEYS"
    };

    const end_screen = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <div style="text-align:center;">
          <h2>Thank you!</h2>
          <p>The experiment is now complete.</p>
        </div>
      `,
      choices: "NO_KEYS",
      trial_duration: 2000
    };

    // ─── RUN EXPERIMENT ──────────────────────────────────────────
    jsPsych.run([
      instructions_p1,
      ...phase1_randomized,
      instructions_p2,
      ...phase2_randomized,
      end_screen
    ]);

  </script>
</html>
