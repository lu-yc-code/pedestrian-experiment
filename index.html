<!DOCTYPE html>
<html>
  <head>
    <title>Pedestrian Experiment</title>
    <script src="https://unpkg.com/jspsych@8.2.3/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-video-keyboard-response@2.1.0/dist/index.browser.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/jspsych@8.2.3/css/jspsych.css">
    <style>
      body { background-color: white; color: black; }
      .jspsych-display-element { background-color: white; color: black; }
    </style>
  </head>
  <body></body>
  <script>

    const IMAGES_PER_CONDITION = 20; // Phase 1: 2×20=40張, Phase 2: 4×20=80張, 合計120張
    const PHASE1_REPS = 15;
    const PHASE2_REPS = 15;

    // ─── Image filename prefix mapping ──────────────────────────
    const image_map = {
      '1_congruent_proceed': 'p1_congruent_proceed',
      '1_congruent_stop':    'p1_congruent_brake',
      '2_congruent_proceed': 'p2_congruent_proceed',
      '2_congruent_stop':    'p2_congruent_brake',
      '2_conflict_A':        'p2_conflict_proceed',
      '2_conflict_B':        'p2_conflict_brake',
    };

    function makeImages(phase, condition) {
      const prefix = image_map[phase + '_' + condition];
      return Array.from({ length: IMAGES_PER_CONDITION }, (_, i) =>
        `images/${prefix}_${String(i + 1).padStart(2, '0')}.png`
      );
    }

    const jsPsych = initJsPsych({
      on_finish: function() {
        const all_data = jsPsych.data.get().filterCustom(function(trial) {
          return trial.condition !== undefined;
        }).values();

        const headers = ['condition', 'phase', 'image', 'rt', 'response', 'trial_index', 'time_elapsed'];
        const rows = all_data.map(trial =>
          headers.map(h => '"' + String(trial[h] || '').replace(/"/g, '""') + '"').join(',')
        );
        const csv_data = headers.map(h => '"' + h + '"').join(',') + '\n' + rows.join('\n');

        window.parent.postMessage({
          type: "EXPERIMENT_DATA",
          csv_data: csv_data
        }, "*");
      }
    });

    // ─── FIXATION ───────────────────────────────────────────────
    const fixation = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: '<p style="font-size:48px;">+</p>',
      choices: "NO_KEYS",
      trial_duration: 300
    };

    // ─── ITI ────────────────────────────────────────────────────
    const iti = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: '',
      choices: "NO_KEYS",
      trial_duration: 500
    };

    // ─── Key reminder (colored) ──────────────────────────────────
    const key_reminder = `
      <p style="font-size:16px; margin-top:16px;">
        Press <strong style="color:#537685;">F = Stop</strong>
        &nbsp;&nbsp;&nbsp;
        Press <strong style="color:#ED8428;">J = Proceed</strong>
      </p>
    `;

    // ─── HELPER: 產生一個正式 trial ──────────────────────────────
    function make_trial(condition, phase, img_src) {
      return {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `
          <div style="text-align:center;">
            <img src="${img_src}" style="max-width:720px; max-height:65vh; width:auto; height:auto; display:block; margin:0 auto 16px auto;">
            ${key_reminder}
          </div>
        `,
        choices: ['f', 'j'],
        data: {
          condition: condition,
          phase: phase,
          image: img_src
        }
      };
    }

    // ─── HELPER: 產生一個練習 trial ──────────────────────────────
    function make_practice_trial(img_src) {
      return [
        fixation,
        {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: `
            <div style="text-align:center;">
              <img src="${img_src}" style="max-width:720px; max-height:65vh; width:auto; height:auto; display:block; margin:0 auto 16px auto;">
              ${key_reminder}
            </div>
          `,
          choices: ['f', 'j'],
          data: { condition: 'practice', phase: 0, image: img_src }
        },
        {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: function() {
            const last = jsPsych.data.get().last(1).values()[0];
            const choice = last.response === 'f'
              ? '<span style="color:#537685; font-weight:bold;">Stop</span>'
              : '<span style="color:#ED8428; font-weight:bold;">Proceed</span>';
            return `
              <div style="text-align:center; max-width:500px; margin:60px auto;">
                <p style="font-size:22px;">You pressed: ${choice}</p>
                <p style="font-size:14px; color:#999;">Continuing in 2 seconds...</p>
              </div>
            `;
          },
          choices: "NO_KEYS",
          trial_duration: 2000
        },
        iti
      ];
    }

    // ─── EXPERIMENT INTRODUCTION ─────────────────────────────────

    const intro_1 = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <div style="max-width:660px; margin:0 auto; text-align:left; line-height:1.8;">
          <h2 style="text-align:center;">Welcome</h2>
          <p>In this experiment, you will view a series of driving scenes from a first-person driver's perspective.</p>
          <p>For each scene, you will decide whether you would <strong>Stop</strong> or <strong>Proceed</strong>.</p>
          <hr style="margin:24px 0;">
          <h3>Key Definitions</h3>
          <p>
            <strong style="color:#537685;">Stop (F key):</strong><br>
            You would come to a <em>complete stop</em> and wait for the pedestrian to pass.
          </p>
          <p>
            <strong style="color:#ED8428;">Proceed (J key):</strong><br>
            You would continue through the intersection, even if you slow down slightly.
          </p>
          <hr style="margin:24px 0;">
          <p style="text-align:center; color:#888; font-size:14px;">Press any key to continue.</p>
        </div>
      `,
      choices: "ALL_KEYS"
    };

    const intro_2 = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <div style="max-width:660px; margin:0 auto; text-align:center; line-height:1.8;">
          <h2>Your Response Keys</h2>
          <p style="text-align:left;">Place your left index finger on <strong>F</strong> and your right index finger on <strong>J</strong> before each trial.</p>
          <div style="display:flex; justify-content:center; gap:80px; margin:30px 0;">
            <div style="text-align:center;">
              <div style="
                width:90px; height:90px;
                background:#537685; color:white;
                font-size:40px; font-weight:bold;
                display:flex; align-items:center; justify-content:center;
                border-radius:10px; margin:0 auto 12px auto;
              ">F</div>
              <strong style="color:#537685;">Stop</strong><br>
              <span style="font-size:13px; color:#888;">Complete stop</span>
            </div>
            <div style="text-align:center;">
              <div style="
                width:90px; height:90px;
                background:#ED8428; color:white;
                font-size:40px; font-weight:bold;
                display:flex; align-items:center; justify-content:center;
                border-radius:10px; margin:0 auto 12px auto;
              ">J</div>
              <strong style="color:#ED8428;">Proceed</strong><br>
              <span style="font-size:13px; color:#888;">Continue through intersection</span>
            </div>
          </div>
          <p style="color:#888; font-size:14px;">Press any key to continue.</p>
        </div>
      `,
      choices: "ALL_KEYS"
    };

    const intro_3 = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <div style="max-width:660px; margin:0 auto; text-align:left; line-height:1.8;">
          <h2 style="text-align:center;">Your Goal</h2>
          <p>For each scene, please try to make the <strong>most correct decision as soon as possible</strong>.</p>
          <p>Both <strong>accuracy</strong> and <strong>response speed</strong> are important throughout the experiment.</p>
          <p>The experiment consists of two phases. You will receive instructions before each phase.</p>
          <hr style="margin:24px 0;">
          <p>You will first complete <strong>5 practice trials</strong> to get familiar with the keys.</p>
          <p style="text-align:center; color:#888; font-size:14px;">Press any key to begin the practice.</p>
        </div>
      `,
      choices: "ALL_KEYS"
    };

    // ─── PRACTICE TRIALS ─────────────────────────────────────────
    const practice_image_paths = [
      'images/practice_01.png',
      'images/practice_02.png',
      'images/practice_03.png',
      'images/practice_04.png',
      'images/practice_05.png',
    ];

    const practice_trials = practice_image_paths.flatMap(path =>
      make_practice_trial(path)
    );

    const practice_end = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <div style="max-width:600px; margin:0 auto; text-align:center; line-height:1.8;">
          <h2>Practice Complete</h2>
          <p>Great! You have finished the practice trials.</p>
          <p>The main experiment will now begin.</p>
          <p style="margin-top:20px;">
            Remember:<br>
            <strong style="color:#537685;">F = Stop</strong>
            &nbsp;&nbsp;&nbsp;
            <strong style="color:#ED8428;">J = Proceed</strong>
          </p>
          <p style="color:#888; font-size:14px; margin-top:24px;">Press any key to begin Phase 1.</p>
        </div>
      `,
      choices: "ALL_KEYS"
    };

    // ─── PHASE 1 CONDITIONS ──────────────────────────────────────
    // congruent_proceed: Green Light + pedestrian intent unclear
    // congruent_stop:    Red Light   + pedestrian intent clear
    const phase1_conditions = ['congruent_proceed', 'congruent_stop'];

    const phase1_blocks = [];
    phase1_conditions.forEach(condition => {
      const shuffled = jsPsych.randomization.shuffle(makeImages(1, condition));
      for (let i = 0; i < PHASE1_REPS; i++) {
        phase1_blocks.push([
          fixation,
          make_trial(condition, 1, shuffled[i]),
          iti
        ]);
      }
    });
    const phase1_randomized = jsPsych.randomization.shuffle(phase1_blocks).flat();

    // ─── PHASE 2 CONDITIONS ──────────────────────────────────────
    // congruent_proceed: Green Light + intent unclear  → Proceed expected
    // congruent_stop:    Red Light   + intent clear    → Stop expected
    // conflict_A:        Green Light + intent clear    → conflict
    // conflict_B:        Red Light   + intent unclear  → conflict
    const phase2_conditions = ['congruent_proceed', 'congruent_stop', 'conflict_A', 'conflict_B'];

    const phase2_blocks = [];
    phase2_conditions.forEach(condition => {
      const shuffled = jsPsych.randomization.shuffle(makeImages(2, condition));
      for (let i = 0; i < PHASE2_REPS; i++) {
        phase2_blocks.push([
          fixation,
          make_trial(condition, 2, shuffled[i]),
          iti
        ]);
      }
    });
    const phase2_randomized = jsPsych.randomization.shuffle(phase2_blocks).flat();

    // ─── PHASE INSTRUCTIONS ──────────────────────────────────────
    const instructions_p1 = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <div style="max-width:660px; margin:0 auto; text-align:left; line-height:1.8;">
          <h2>Phase 1: Scene Classification</h2>
          <p>You will see a series of driving scenes.</p>
          <p>For each scene, please try to make the <strong>most correct decision as soon as possible</strong>:</p>
          <ul>
            <li>Press <strong style="color:#537685;">F = Stop</strong> (come to a complete stop and wait for the pedestrian)</li>
            <li>Press <strong style="color:#ED8428;">J = Proceed</strong> (continue through the intersection, even if you slow down)</li>
          </ul>
          <p style="text-align:center; color:#888; font-size:14px; margin-top:24px;">Press any key to begin.</p>
        </div>
      `,
      choices: "ALL_KEYS"
    };

    const instructions_p2 = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <div style="max-width:660px; margin:0 auto; text-align:left; line-height:1.8;">
          <h2>Phase 2: Judgment Task</h2>
          <p>You will see another series of driving scenes.</p>
          <p>For each scene, please try to make the <strong>most correct decision as soon as possible</strong>:</p>
          <ul>
            <li>Press <strong style="color:#537685;">F = Stop</strong> (come to a complete stop and wait for the pedestrian)</li>
            <li>Press <strong style="color:#ED8428;">J = Proceed</strong> (continue through the intersection, even if you slow down)</li>
          </ul>
          <p>Both <strong>response speed and accuracy</strong> are important.</p>
          <p style="text-align:center; color:#888; font-size:14px; margin-top:24px;">Press any key to begin.</p>
        </div>
      `,
      choices: "ALL_KEYS"
    };

    const end_screen = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <div style="text-align:center;">
          <h2>Thank you!</h2>
          <p>The experiment is now complete.</p>
        </div>
      `,
      choices: "NO_KEYS",
      trial_duration: 2000
    };

    // ─── RUN EXPERIMENT ──────────────────────────────────────────
    jsPsych.run([
      intro_1,
      intro_2,
      intro_3,
      ...practice_trials,
      practice_end,
      instructions_p1,
      ...phase1_randomized,
      instructions_p2,
      ...phase2_randomized,
      end_screen
    ]);

  </script>
</html>
